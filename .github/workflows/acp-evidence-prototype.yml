name: ACP evidence prototype Rust check

on:
  push:
    branches:
      - research/acp-event-evidence-20261106
    paths:
      - 'experiments/acp-event-evidence/rust/**'
      - '.github/workflows/acp-evidence-prototype.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'experiments/acp-event-evidence/rust/**'
      - '.github/workflows/acp-evidence-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-rust-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Show rustc identity
        run: rustc --version
      - name: Compile standalone Rust test binary
        run: rustc --edition=2021 --test crates/webcodex-runner/src/webcodex_runner/coding_agent/evidence.rs -o "$RUNNER_TEMP/acp-evidence-tests"
      - name: Run actual tests
        run: "$RUNNER_TEMP/acp-evidence-tests" --nocapture
